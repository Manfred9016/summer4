<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Sports Interactive</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* VILLAINS Neon Theme */
            --bg-dark: #0b0b12;
            --panel-bg: #161625;
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --neon-green: #39ff14;
            --neon-red: #ff073a;
            --text-main: #ffffff;
            --text-muted: #a0aab5;
            --correct: #39ff14;
            --incorrect: #ff073a;
            --radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            background-image: 
              radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.05), transparent 25%),
              radial-gradient(circle at 85% 30%, rgba(255, 0, 234, 0.05), transparent 25%);
        }

        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .header-banner {
            background-color: rgba(11, 11, 18, 0.9);
            border-bottom: 2px solid var(--neon-pink);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px rgba(255, 0, 234, 0.3);
            z-index: 10;
        }

        .header-banner h1 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-pink);
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: bold;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
        }

        #app-container {
            max-width: 900px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            position: relative;
            z-index: 10;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .level-card {
            background: var(--panel-bg);
            border: 2px solid #333;
            border-radius: var(--radius-lg);
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            opacity: 0.9;
        }

        .level-card:hover {
            opacity: 1;
            transform: scale(1.05) translateY(-5px);
            border-color: var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .level-card h2, .level-card h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
            margin-top: 1rem;
            text-transform: uppercase;
        }

        .level-image {
            width: 100%;
            height: auto;
            max-height: 280px;
            object-fit: contain;
            border-radius: 8px;
            border: 2px solid var(--neon-pink);
            background-color: rgba(0, 0, 0, 0.4);
        }

        .action-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 15px;
            background: rgba(22, 22, 37, 0.8);
            border: 2px solid #444;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            color: white;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            margin-top: 1rem;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .action-btn:hover:not(:disabled) {
            border-color: var(--neon-blue);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.3);
            color: var(--neon-blue);
        }
        
        .action-btn:hover:not(:disabled)::before { left: 100%; }
        .action-btn:active:not(:disabled) { transform: translateY(1px); }

        .btn-correct { background-color: rgba(57, 255, 20, 0.2) !important; border-color: var(--neon-green) !important; box-shadow: 0 0 15px var(--neon-green) !important; color: var(--neon-green) !important; }
        .btn-wrong { background-color: rgba(255, 7, 58, 0.2) !important; border-color: var(--neon-red) !important; box-shadow: 0 0 15px var(--neon-red) !important; color: var(--neon-red) !important; }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 2rem;
        }

        @media (max-width: 600px) {
            .nav-buttons { flex-direction: column; gap: 15px; }
            .nav-buttons .action-btn { width: 100% !important; margin-top: 0; }
        }

        .reading-container {
            background: var(--panel-bg);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            border: 2px solid #333;
            margin-bottom: 2rem;
            line-height: 1.8;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .reading-container h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: rgba(0, 243, 255, 0.05);
            border-radius: 8px;
            border: 1px solid var(--neon-blue);
        }

        .cloud-word {
            background: var(--bg-dark);
            color: var(--neon-blue);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            border: 1px solid var(--neon-blue);
            transition: all 0.3s;
        }

        .cloud-word.found {
            background: rgba(57, 255, 20, 0.2);
            color: var(--neon-green);
            border-color: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
            text-decoration: line-through;
        }

        .interactive-word {
            cursor: pointer;
            padding: 0 2px;
            border-bottom: 1px dashed var(--neon-blue);
            transition: background 0.2s;
        }

        .interactive-word.revealed {
            background: var(--neon-blue);
            color: #000;
            font-weight: bold;
        }

        hr { border: 0; height: 1px; background: #333; margin: 2rem 0; }

        input[type="text"] {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            border: 2px solid #444;
            border-radius: 8px;
            background: var(--bg-dark);
            color: var(--neon-blue);
            margin-top: 1rem;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .flashcard-scene {
            width: 100%;
            height: 300px;
            perspective: 1000px;
            margin: 2rem 0;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flashcard.is-flipped { transform: rotateY(180deg); }
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--panel-bg);
            border: 2px solid var(--neon-pink);
            border-radius: var(--radius-lg);
            box-shadow: 0 0 20px rgba(255, 0, 234, 0.2);
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: var(--neon-pink);
        }
        .flashcard-back {
            transform: rotateY(180deg);
            background: var(--bg-dark);
            color: var(--neon-blue);
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        .sentence-dropzone, .word-bank {
            min-height: 80px;
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--bg-dark);
        }
        .draggable-word {
            padding: 10px 15px;
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            transition: transform 0.1s;
            user-select: none;
        }
        .draggable-word:hover {
            background: rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.3s ease-out forwards; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>

    <script>
        function initParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particlesArray = [];
            const colors = ['#00f3ff', '#FF7700', '#00F0FF'];

            for (let i = 0; i < 50; i++) {
                particlesArray.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speedY: Math.random() * 1 - 0.5,
                    speedX: Math.random() * 1 - 0.5,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particlesArray.length; i++) {
                    let p = particlesArray[i];
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                }
                requestAnimationFrame(animate);
            }
            animate();
        }
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('particles');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        function scrambleString(str) {
            let arr = str.split('');
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            let scrambled = arr.join('');
            if (scrambled === str && str.length > 3) return scrambleString(str);
            return scrambled;
        }

        const feedbackZone = document.getElementById('athlete-feedback-zone');
        feedbackZone.innerHTML = `
            <span style="display: block; color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); font-size: 1.5rem; font-weight: bold; margin: 2rem 0; text-transform: uppercase; animation: shake 0.4s ease-in-out; font-family: 'Orbitron', sans-serif;">
                Incorrect! ${activeAthletes[athleteChallengeIndex].name} plays for ${correct}.
            </span>`;
        setTimeout(() => {
            athleteChallengeIndex++;
            renderAthleteChallenge(); 
        }, 2200);
        }
        }

       // --- ACTIVITY 7: EMOJI SPORT GUESS CHALLENGE ---
function startSportChallenge() {
    sportChallengeIndex = 0;
    activeSports = [...sportsDB].sort(() => 0.5 - Math.random());
    renderSportChallenge();
}

function renderSportChallenge() {
    if (sportChallengeIndex >= activeSports.length) {
        alert("Emoji Sport Challenge Complete! You're a True Champion.");
        return renderMenu();
    }

    const currentSport = activeSports[sportChallengeIndex];
    
    let options = [currentSport.name];
    let pool = ALL_SPORTS.filter(n => n !== currentSport.name);
    pool.sort(() => 0.5 - Math.random());
    options.push(...pool.slice(0, 5));
    options.sort(() => 0.5 - Math.random()); 

    appContainer.innerHTML = `
        <button class="action-btn" style="width:auto; margin-bottom: 1rem;" onclick="renderMenu()">← Back to Menu</button>
        <div class="reading-container animate-pop" style="padding-bottom: 1rem; text-align: center;">
            <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:1rem;">
                <span>Emoji Guess ${sportChallengeIndex + 1} of ${activeSports.length}</span>
            </div>

            <div id="sport-feedback-zone" style="min-height: 250px; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.4); border: 4px solid var(--neon-pink); border-radius: 12px; margin-bottom: 2rem; box-shadow: 0 0 20px rgba(255,0,234,0.3);">
                <span style="font-size: 6rem; text-shadow: 0 0 30px rgba(255, 0, 234, 0.8); user-select: none;">${currentSport.emoji}</span>
            </div>

            <h3 style="color: #fff; margin-bottom: 1rem;">Which sport do these emojis represent?</h3>

            <div class="card-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
                ${options.map(opt => `
                    <button class="action-btn" style="margin-top: 0; padding: 1rem 0.5rem; font-size: 0.9rem; line-height: 1.3; word-wrap: break-word;" onclick="checkSportGuess(this, '${opt}', '${currentSport.name}')">${opt}</button>
                `).join('')}
            </div>
        </div>
    `;
}

function checkSportGuess(btn, selected, correct) {
    const allButtons = btn.parentElement.querySelectorAll('button');
    allButtons.forEach(b => b.style.pointerEvents = 'none');

    if (selected === correct) {
        btn.classList.add('btn-correct');
        updateXP(20);
        setTimeout(() => {
            sportChallengeIndex++;
            renderSportChallenge();
        }, 1000);
    } else {
        btn.classList.add('btn-wrong');
        const feedbackZone = document.getElementById('sport-feedback-zone');
        feedbackZone.innerHTML = `
            <span style="display: block; color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); font-size: 1.5rem; font-weight: bold; margin: 2rem 0; text-transform: uppercase; animation: shake 0.4s ease-in-out; font-family: 'Orbitron', sans-serif;">
                Incorrect! The answer is ${correct}.
            </span>`;
        setTimeout(() => {
            sportChallengeIndex++;
            renderSportChallenge(); 
        }, 2200);
    }
}
        
        // Boot up
        init();
    </script>
